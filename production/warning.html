<!DOCTYPE html>
<html>
<head>
  <title>Proxy Warning</title>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 20px; text-align: center; }
    h1 { font-size: 1.2em; }
    p { font-size: 0.9em; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Proxy Warning</h1>
  <p>To book this flight, the extension will set a browser-wide proxy. This may affect other tabs. The proxy will be automatically disabled when you close the booking tab.</p>
  <button id="proceed-button">Proceed</button>
  <button id="cancel-button">Cancel</button>
  <script src="warning.js"></script>
</body>
</html>
